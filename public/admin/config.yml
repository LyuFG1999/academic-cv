backend:
  name: git-gateway
  branch: main

site_url: https://delicate-biscochitos-9061ae.netlify.app
display_url: https://delicate-biscochitos-9061ae.netlify.app
publish_mode: simple
show_preview_links: false
editor:
  preview: false
media_folder: public/uploads
public_folder: /uploads

commit_messages:
  create: "内容：新建 {{collection}} {{slug}}"
  update: "内容：更新 {{collection}} {{slug}}"
  delete: "内容：删除 {{collection}} {{slug}}"
  uploadMedia: "媒体：上传 {{path}}"
  deleteMedia: "媒体：删除 {{path}}"

collections:
  - name: settings
    label: 01 网站设置
    files:
      - name: navigation
        label: 导航栏与成果显示
        file: src/data/navigation.json
        format: json
        fields:
          - label: 首页
            name: home
            widget: object
            fields: &nav_fields
              - { label: 显示, name: enabled, widget: boolean, default: true }
              - { label: 中文名, name: zh, widget: string }
              - { label: English name, name: en, widget: string }
          - label: 研究
            name: research
            widget: object
            fields: *nav_fields
          - label: 成果
            name: papers
            widget: object
            fields: *nav_fields
          - label: 课程
            name: courses
            widget: object
            fields: *nav_fields
          - label: 博客
            name: blog
            widget: object
            fields: *nav_fields
          - label: 履历
            name: cv
            widget: object
            fields: *nav_fields
          - label: Papers 页面展示范围
            name: paperDisplay
            widget: select
            default: all
            hint: 选择某一类后，Papers 页面和首页近期成果只展示该类别。
            options:
              - { label: 展示全部类别, value: all }
              - { label: 只展示已发表论文, value: published }
              - { label: 只展示工作论文, value: working }
              - { label: 只展示书籍, value: book }
      - name: appearance
        label: 外观与配色
        file: src/data/appearance.json
        format: json
        fields:
          - { label: 启用首页入场动画, name: introEnabled, widget: boolean, default: true, hint: 每个浏览器会话只展示一次，下滑进入网站后不会返回。 }
          - label: 浅色模式
            name: light
            widget: object
            fields: &palette_fields
              - { label: 主色, name: primary, widget: color, allowInput: true }
              - { label: 辅助色, name: secondary, widget: color, allowInput: true }
              - { label: 强调色, name: accent, widget: color, allowInput: true }
              - { label: 页面背景, name: background, widget: color, allowInput: true }
              - { label: 卡片背景, name: surface, widget: color, allowInput: true }
          - label: 深色模式
            name: dark
            widget: object
            fields: *palette_fields
      - name: social
        label: 联系方式
        file: src/data/social.json
        format: json
        fields:
          - label: 邮箱
            name: email
            widget: object
            fields:
              - { label: 显示, name: enabled, widget: boolean, default: true }
              - { label: 邮箱地址, name: url, widget: string, required: false, pattern: ['^[^ @]+@[^ @]+[.][^ @]+$', '请输入有效邮箱地址'] }
          - label: GitHub
            name: github
            widget: object
            fields: &social_url_fields
              - { label: 显示, name: enabled, widget: boolean, default: true }
              - { label: 主页链接, name: url, widget: string, required: false, pattern: ['^https?://.+', '请输入以 http:// 或 https:// 开头的完整链接'] }
          - { label: ORCID, name: orcid, widget: object, fields: *social_url_fields }
          - { label: 知网主页, name: cnki, widget: object, fields: *social_url_fields }
          - { label: 学校主页, name: school, widget: object, fields: *social_url_fields }
          - { label: X, name: x, widget: object, fields: *social_url_fields }
          - { label: LinkedIn, name: linkedin, widget: object, fields: *social_url_fields }

  - name: profile
    label: 02 个人主页
    files:
      - name: site_zh
        label: 中文主页与研究
        file: src/data/site.zh.json
        format: json
        fields:
          - { label: 姓名, name: fullName, widget: string }
          - { label: 身份或职称, name: title, widget: string }
          - { label: 院校或机构, name: institute, widget: string }
          - { label: 论文作者姓名, name: authorName, widget: string, required: false, hint: 用于突出显示作者姓名；多个写法请用竖线分隔，例如 吕风光|Fengguang Lyu }
          - { label: 首页简介, name: intro, widget: text }
          - { label: 研究陈述, name: researchStatement, widget: text }
          - { label: 研究贡献, name: researchImpact, widget: text }
          - { label: 侧栏头像, name: avatar, widget: image }
          - { label: 浏览器标题, name: seoTitle, widget: string }
          - { label: 搜索摘要, name: seoDescription, widget: text }
          - label: 研究领域
            name: researchAreas
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}}"
            fields: &research_area_fields
              - { label: 名称, name: title, widget: string }
              - { label: 简介, name: description, widget: text }
              - label: 图标
                name: field
                widget: select
                default: computer-science
                options: [computer-science, physics, biology, chemistry, mathematics, law, engineering]
          - label: 研究项目
            name: projects
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}}"
            fields: &project_fields
              - { label: 项目名称, name: title, widget: string }
              - { label: 项目介绍, name: description, widget: text }
              - { label: 项目链接, name: link, widget: string, required: false, pattern: ['^https?://.+', '请输入完整的网址'] }
      - name: site_en
        label: English Profile & Research
        file: src/data/site.en.json
        format: json
        fields:
          - { label: Name, name: fullName, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: Institute, name: institute, widget: string }
          - { label: Author name, name: authorName, widget: string, required: false, hint: Separate aliases with |, for example Fengguang Lyu|Lyu, Fengguang }
          - { label: Home introduction, name: intro, widget: text }
          - { label: Research statement, name: researchStatement, widget: text }
          - { label: Research impact, name: researchImpact, widget: text }
          - { label: Sidebar portrait, name: avatar, widget: image }
          - { label: Browser title, name: seoTitle, widget: string }
          - { label: Search description, name: seoDescription, widget: text }
          - label: Research areas
            name: researchAreas
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}}"
            fields: *research_area_fields
          - label: Projects
            name: projects
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}}"
            fields: *project_fields

  - name: cv
    label: 03 履历与成果
    files:
      - name: cv_zh
        label: 中文履历与成果
        file: src/data/cv.zh.json
        format: json
        fields:
          - label: 工作经历
            name: experiences
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}} — {{fields.company}}"
            fields: &experience_fields
              - { label: 机构, name: company, widget: string }
              - { label: 时间, name: time, widget: string, hint: 例如 2022 - 至今 }
              - { label: 排序日期, name: sortDate, widget: datetime, required: false, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD, hint: 可选，仅用于控制排序，不在网页显示。 }
              - { label: 职位, name: title, widget: string }
              - { label: 地点, name: location, widget: string, required: false }
              - { label: 说明, name: description, widget: text, required: false }
          - label: 教育经历
            name: education
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.degree}} — {{fields.school}}"
            fields: &education_fields
              - { label: 学校, name: school, widget: string }
              - { label: 时间, name: time, widget: string }
              - { label: 排序日期, name: sortDate, widget: datetime, required: false, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD, hint: 可选，仅用于控制排序，不在网页显示。 }
              - { label: 学位, name: degree, widget: string }
              - { label: 地点, name: location, widget: string, required: false }
              - { label: 说明, name: description, widget: text, required: false }
          - label: 技能
            name: skills
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}}"
            fields: &skill_fields
              - { label: 名称, name: title, widget: string }
              - { label: 说明, name: description, widget: text }
          - label: 论文与书籍
            name: publications
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}}"
            fields: &publication_fields
              - label: 类别
                name: category
                widget: select
                default: published
                options:
                  - { label: 已发表论文, value: published }
                  - { label: 工作论文, value: working }
                  - { label: 书籍, value: book }
              - { label: 标题, name: title, widget: string }
              - { label: 作者, name: authors, widget: string }
              - { label: 期刊或出版物, name: journal, widget: string }
              - { label: 时间, name: time, widget: string }
              - { label: 排序日期, name: sortDate, widget: datetime, required: false, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD, hint: 可选，仅用于控制排序，不在网页显示。 }
              - { label: 链接, name: link, widget: string, required: false, pattern: ['^https?://.+', '请输入完整的网址'] }
              - { label: 摘要, name: abstract, widget: text, required: false }
      - name: cv_en
        label: English CV & Publications
        file: src/data/cv.en.json
        format: json
        fields:
          - label: Experience
            name: experiences
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}} — {{fields.company}}"
            fields: *experience_fields
          - label: Education
            name: education
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.degree}} — {{fields.school}}"
            fields: *education_fields
          - label: Skills
            name: skills
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}}"
            fields: *skill_fields
          - label: Papers and books
            name: publications
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}}"
            fields: *publication_fields

  - name: courses
    label: 04 课程
    files:
      - name: courses_zh
        label: 中文课程
        file: src/data/courses.zh.json
        format: json
        fields:
          - { label: 页面简介, name: intro, widget: text, required: false }
          - label: 课程列表
            name: courses
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}} · {{fields.term}}"
            fields: &course_fields
              - { label: 课程名称, name: title, widget: string }
              - { label: 课程编号, name: code, widget: string, required: false }
              - { label: 学期或时间, name: term, widget: string }
              - { label: 授课角色, name: role, widget: string, required: false }
              - { label: 课程简介, name: description, widget: text, required: false }
              - { label: 课程链接, name: link, widget: string, required: false, pattern: ['^https?://.+', '请输入完整的网址'] }
      - name: courses_en
        label: English Courses
        file: src/data/courses.en.json
        format: json
        fields:
          - { label: Page introduction, name: intro, widget: text, required: false }
          - label: Courses
            name: courses
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}} · {{fields.term}}"
            fields: *course_fields

  - name: blog
    label: 05 博客
    label_singular: 博客文章
    folder: src/content/BlogPosts
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} · {{language}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - label: 语言
        name: language
        widget: select
        default: zh
        options:
          - { label: 中文, value: zh }
          - { label: English, value: en }
      - { label: 日期, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { label: 摘要, name: excerpt, widget: text }
      - { label: 标签, name: tags, widget: list, required: false, collapsed: true }
      - { label: 题图, name: featuredImage, widget: image, required: false }
      - label: 附件下载区
        name: attachments
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.label}}"
        hint: 上传文件并填写名称后，文章底部会自动出现下载按钮。
        fields:
          - { label: 下载名称, name: label, widget: string }
          - { label: 文件, name: file, widget: file }
      - { label: 草稿, name: draft, widget: boolean, default: false }
      - { label: 正文, name: body, widget: richtext, buttons: [bold, italic, code, link, heading-one, heading-two, heading-three, quote, bulleted-list, numbered-list] }
