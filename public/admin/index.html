<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>网站管理</title>
  <link rel="stylesheet" href="./dashboard.css" />
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script type="module" src="./dashboard.js"></script>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="brand" href="./">网站管理<span>内容与外观</span></a>
      <nav id="section-nav" aria-label="设置分类"></nav>
      <div class="sidebar-footer">
        <a href="./editor/#/collections/blog">博客写作 ↗</a>
        <a href="/zh/" target="_blank" rel="noopener">查看网站 ↗</a>
        <button id="account" type="button">登录后台</button>
      </div>
    </aside>
    <main>
      <header class="toolbar">
        <div><h1>网站设置</h1><p id="status" role="status" aria-live="polite">正在连接后台…</p></div>
        <button id="save" type="submit" form="settings-form" class="primary" disabled>保存并发布</button>
      </header>
      <div id="login-panel" class="welcome" hidden>
        <h2>欢迎回来</h2><p>登录后，直接编辑网站内容、双语资料与配色。</p>
        <button id="login" type="button" class="primary">登录后台</button>
      </div>
      <form id="settings-form" hidden></form>
      <noscript>请启用 JavaScript 后管理网站。</noscript>
    </main>
  </div>
</body>
</html>
