<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>学术主页后台</title>
    <style>
      :root { color-scheme: light; }
      body { background: #f5f7fb; }
      button, input, textarea, select { border-radius: 8px !important; }
      [data-slate-editor="true"] { min-height: 22rem; }
      [data-testid*="quick-add" i], [class*="QuickAdd"] { display: none !important; }
    </style>
    <script>
      // Open the unified settings editor immediately instead of the dashboard.
      // Invitation and password-recovery hashes are deliberately left untouched.
      (function () {
        var settingsHash = '#/collections/settings/entries/site';
        var openSettingsFromDashboard = function () {
          if (!location.hash || location.hash === '#' || location.hash === '#/') {
            location.replace(location.pathname + location.search + settingsHash);
          }
        };
        openSettingsFromDashboard();
        window.addEventListener('hashchange', openSettingsFromDashboard);
      })();
    </script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      CMS.registerEditorComponent({
        id: 'download-file',
        label: '插入文件下载',
        fields: [
          { name: 'label', label: '链接文字', widget: 'string' },
          { name: 'file', label: '上传或选择文件', widget: 'file' }
        ],
        pattern: /^\[📎 (.+?)\]\((.+?)\)$/,
        fromBlock: function (match) {
          return { label: match[1], file: match[2] };
        },
        toBlock: function (data) {
          var file = data.file || '';
          if (file.indexOf('/uploads/') === 0) file = '../../../' + file.slice(1);
          return '[📎 ' + data.label + '](' + file + ')';
        },
        toPreview: function (data) {
          return '<a href="' + data.file + '" download>📎 ' + data.label + '</a>';
        }
      });

      // Defense in depth if a future Decap route exposes the dashboard again.
      var hideQuickAdd = function () {
        document.querySelectorAll('button, a').forEach(function (element) {
          var label = (element.textContent || element.getAttribute('aria-label') || '').trim().toLowerCase();
          if (label === 'quick add' || label === '快速添加' || label === '快速新增') {
            element.style.display = 'none';
          }
        });
      };
      new MutationObserver(hideQuickAdd).observe(document.body, { childList: true, subtree: true });
      hideQuickAdd();
    </script>
  </body>
</html>
